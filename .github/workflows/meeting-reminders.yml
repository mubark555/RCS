# يرسل تذكيرات الاجتماعات المستحقة كل 15 دقيقة.
# يحتاج أسرار المستودع: APP_URL (رابط النظام) و CRON_SECRET (نفس قيمته في Vercel).
# بدون الأسرار يتوقف بهدوء دون أي خطأ.
name: Meeting reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due meeting reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not set — skipping."; exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/meeting-reminders"
